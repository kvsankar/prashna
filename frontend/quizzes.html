<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prashna — quiz library</title>
</head>
<body>
  <header class="top">
    <h1>Quiz library</h1>
    <div class="meta"><a href="/">← home</a></div>
  </header>

  <div class="page-nav wide">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <ol>
        <li><a href="/">Admin</a></li>
        <li><span aria-current="page">Quiz library</span></li>
      </ol>
    </nav>
    <nav class="section-links" aria-label="Quiz library sections">
      <a href="#quiz-library-card">Quizzes</a>
      <a href="#quiz-runs-card">Quiz runs</a>
    </nav>
  </div>

  <main class="wide">
    <section class="card compact" id="quiz-library-card">
      <div class="card-head">
        <h2>Quizzes</h2>
        <div class="card-tools">
          <input id="new-quiz-title" placeholder="New quiz title" aria-label="New quiz title" class="inline">
          <button class="primary small" id="create-quiz">+ New</button>
        </div>
      </div>
      <!-- No .table-scroll wrapper: it would clip the row menus. Row actions
           wrap on narrow screens instead (app.css). -->
      <table class="ctable" id="quiz-table">
        <thead><tr>
          <th>Title</th><th>Status</th><th class="num">Questions</th><th class="actions">Actions</th>
        </tr></thead>
        <tbody id="quiz-rows"><tr><td colspan="4" class="muted small">Loading…</td></tr></tbody>
      </table>
    </section>

    <section hidden class="card compact" id="editor-card">
      <div class="card-head">
        <h2 id="editor-title">Editing quiz</h2>
        <div class="card-tools">
          <!-- Publish problems navigator (UC-A-21, UX.md §7 Inline problems). -->
          <div hidden class="problem-nav" id="editor-problem-nav" role="group" aria-label="Problems to fix">
            <span class="problem-count" id="editor-problem-count" aria-live="polite"></span>
            <span hidden class="muted small" id="editor-problem-pos"></span>
            <button class="ghost small" type="button" id="editor-problem-prev" aria-label="Previous problem" title="Previous problem">↑</button>
            <button class="ghost small" type="button" id="editor-problem-next" aria-label="Next problem" title="Next problem">↓</button>
          </div>
          <button class="ghost small" id="editor-close">Close</button>
        </div>
      </div>
      <div id="editor-body"></div>
    </section>

    <section class="card compact" id="quiz-runs-card">
      <div class="card-head">
        <h2>Quiz runs</h2>
        <div class="card-tools run-view-switcher" id="run-view-switcher" role="group" aria-label="Group quiz runs">
          <button class="view-option small" type="button" data-run-view="flat" aria-pressed="true">Flat</button>
          <button class="view-option small" type="button" data-run-view="quiz" aria-pressed="false">By quiz</button>
          <button class="view-option small" type="button" data-run-view="version" aria-pressed="false">By version</button>
          <button class="view-option small" type="button" data-run-view="session" aria-pressed="false">By session</button>
        </div>
      </div>
      <p class="muted small" id="qs-view-summary">Each row is one time a quiz was played in a session.</p>
      <div class="table-scroll" id="qs-flat">
        <table class="ctable stack" id="qs-table">
          <thead><tr>
            <th>Quiz</th><th>Version</th><th>In session</th><th>Status</th><th class="num">Progress</th><th class="num">Responses</th><th>Created</th>
          </tr></thead>
          <tbody id="qs-rows"><tr><td colspan="7" class="muted small">Loading…</td></tr></tbody>
        </table>
      </div>
      <div hidden id="qs-groups"></div>
    </section>

    <section hidden class="card compact" id="results-card">
      <div class="card-head">
        <h2 id="results-title">Quiz run results</h2>
        <div class="card-tools" id="results-tools">
          <button class="ghost small" id="results-close">Close</button>
        </div>
      </div>
      <div id="results-body"></div>
    </section>
  </main>

  <script type="module" src="/src/quizzes.ts"></script>
</body>
</html>
