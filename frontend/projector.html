<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Projector — Prashna</title>
</head>
<body class="projector">
  <main class="proj">
    <h1 id="title">Loading…</h1>
    <div class="row gap align-start mb-5">
      <div class="grow">
        <div class="code-display">Join: <strong id="code"></strong> at <span id="origin"></span></div>
      </div>
      <div class="qr-box qr-lg" id="join-qr"></div>
    </div>

    <section hidden id="quiz-section" class="card">
      <div id="quiz-body"></div>
    </section>

    <section class="card">
      <h2>Top questions</h2>
      <div id="queries" class="qa-list"></div>
    </section>
  </main>

  <script type="module" src="/src/projector.ts"></script>
</body>
</html>
