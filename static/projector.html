<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prashna — projector</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { background: var(--proj-bg); }
    main.proj { max-width: none; }
    .qa-list { max-height: 75vh; overflow: auto; }
    #join-qr { cursor: zoom-in; }
    #join-qr:hover { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
    .lightbox {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; cursor: zoom-out; padding: 40px;
    }
    .lightbox-inner {
      width: min(90vh, 90vw); height: min(90vh, 90vw);
      display: flex; align-items: center; justify-content: center;
    }
    .lightbox-inner svg { width: 100%; height: 100%; }
    .lightbox-hint {
      position: fixed; bottom: 28px; left: 0; right: 0;
      text-align: center; color: var(--proj-hint); font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="proj">
    <h1 id="title">Loading…</h1>
    <div class="row gap" style="align-items: flex-start; margin-bottom: 24px;">
      <div style="flex:1;">
        <div class="code-display">Join: <strong id="code"></strong> at <span id="origin"></span></div>
      </div>
      <div id="join-qr" style="width: 220px; min-width: 220px;" title="Click to enlarge" tabindex="0" role="button" aria-label="Enlarge QR code"></div>
    </div>

    <div class="lightbox" id="qr-lightbox" style="display:none;">
      <div class="lightbox-inner" id="qr-lightbox-inner"></div>
      <div class="lightbox-hint">Click anywhere or press Esc to close</div>
    </div>

    <section id="quiz-section" class="card" style="display:none;">
      <div id="quiz-body"></div>
    </section>

    <section class="card">
      <h2>Top questions</h2>
      <div id="questions" class="qa-list"></div>
    </section>
  </main>

  <script type="module">
    import { $, api, el, pathCode, openLiveSocket, renderQR } from "/static/common.js";

    const CODE = pathCode();
    $("#code").textContent = CODE;

    let lastBase = null;

    async function loadAll() {
      const [s, qs, runs] = await Promise.all([
        api(`/api/sessions/${CODE}`),
        api(`/api/sessions/${CODE}/questions`),
        api(`/api/sessions/${CODE}/quiz_runs`),
      ]);
      $("#title").textContent = s.title;
      const base = (s.participant_base_url || location.origin).replace(/\/$/, "");
      const url = `${base}/s/${s.code}`;
      $("#origin").textContent = base.replace(/^https?:\/\//, "");
      if (base !== lastBase) {
        lastBase = base;
        try { await renderQR($("#join-qr"), url, { cellSize: 5, margin: 2 }); }
        catch {}
      }
      renderQuestions(qs);
      renderQuiz(runs.find(r => r.status === "live") || runs.find(r => r.status === "closed"));
    }

    function renderQuestions(qs) {
      const root = $("#questions");
      root.innerHTML = "";
      const top = qs.filter(q => !q.answered).sort((a, b) => b.vote_count - a.vote_count).slice(0, 8);
      if (!top.length) {
        root.appendChild(el("div", { class: "muted" }, "Waiting for questions…"));
        return;
      }
      for (const q of top) {
        root.appendChild(el("div", { class: "question" },
          el("div", { class: "vote-btn" + (q.voted ? " voted" : "") },
            el("div", { class: "count" }, String(q.vote_count)),
            el("div", { class: "label" }, "votes")),
          el("div", { class: "body" },
            el("div", { class: "text" }, q.text),
            q.author_name ? el("div", { class: "small muted" }, "— " + q.author_name) : null),
        ));
      }
    }

    function renderQuiz(run) {
      const section = $("#quiz-section");
      const body = $("#quiz-body");
      if (!run) { section.style.display = "none"; return; }
      section.style.display = "";
      body.innerHTML = "";
      body.appendChild(el("div", { class: "muted" }, `${run.quiz_title} — item ${run.current_item_idx + 1}/${run.item_count}`));
      const q = run.current_item;
      if (!q) return;
      body.appendChild(el("h2", { style: "font-size: 32px; margin: 12px 0;" }, q.text));
      if (q.image_url) body.appendChild(el("img", { class: "q-image", src: q.image_url }));
      const totals = run.results?.totals || {};
      const respondents = run.results?.respondents || 0;
      const showResults = !!run.results;
      for (const op of q.options) {
        const opDiv = el("div", { class: "option disabled" + (showResults && op.is_correct ? " correct" : "") });
        if (showResults) {
          const bar = el("div", { class: "bar" });
          bar.style.transform = `scaleX(${respondents ? (totals[op.id] || 0) / respondents : 0})`;
          opDiv.appendChild(bar);
        }
        if (op.image_url) opDiv.appendChild(el("img", { class: "opt-img", src: op.image_url }));
        opDiv.appendChild(el("div", { class: "opt-text" }, op.text));
        if (showResults) {
          const pct = respondents ? Math.round((totals[op.id] || 0) / respondents * 100) : 0;
          opDiv.appendChild(el("div", { class: "opt-pct" }, `${pct}%`));
        }
        body.appendChild(opDiv);
      }
      if (showResults) body.appendChild(el("div", { class: "muted" }, `${respondents} respondent(s)`));
    }

    // Lightbox: enlarge the join QR on click.
    function openLightbox() {
      const src = $("#join-qr").querySelector("svg");
      if (!src) return;
      const inner = $("#qr-lightbox-inner");
      inner.innerHTML = "";
      const clone = src.cloneNode(true);
      // The thumbnail SVG had inline height:auto; clear it so the big
      // copy fills the square container instead of staying short.
      clone.style.cssText = "width: 100%; height: 100%; display: block; background: white; border-radius: 8px;";
      inner.appendChild(clone);
      $("#qr-lightbox").style.display = "";
    }
    function closeLightbox() { $("#qr-lightbox").style.display = "none"; }
    $("#join-qr").addEventListener("click", openLightbox);
    $("#join-qr").addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLightbox(); }
    });
    $("#qr-lightbox").addEventListener("click", closeLightbox);
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && $("#qr-lightbox").style.display !== "none") closeLightbox();
    });

    loadAll();
    openLiveSocket(CODE, loadAll);
  </script>
</body>
</html>
