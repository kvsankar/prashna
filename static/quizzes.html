<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prashna — quiz library</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <h1>Quiz library</h1>
    <div class="meta"><a href="/">← home</a></div>
  </header>

  <main class="wide">
    <section class="card compact">
      <div class="card-head">
        <h2>Quizzes</h2>
        <div class="card-tools">
          <input id="new-quiz-title" placeholder="New quiz title" class="inline">
          <button class="primary small" id="create-quiz">+ New</button>
        </div>
      </div>
      <table class="ctable" id="quiz-table">
        <thead><tr>
          <th>Title</th><th>Status</th><th class="num">Items</th><th class="actions">Actions</th>
        </tr></thead>
        <tbody id="quiz-rows"><tr><td colspan="4" class="muted small">Loading…</td></tr></tbody>
      </table>
    </section>

    <section class="card compact">
      <div class="card-head">
        <h2>Quiz runs</h2>
        <span class="muted small">Each row is one playthrough of a quiz inside a session.</span>
      </div>
      <table class="ctable" id="qs-table">
        <thead><tr>
          <th>Quiz</th><th>Ver</th><th>In session</th><th>Status</th><th class="num">Progress</th><th class="num">Resp.</th><th>Created</th>
        </tr></thead>
        <tbody id="qs-rows"><tr><td colspan="7" class="muted small">Loading…</td></tr></tbody>
      </table>
    </section>

    <section class="card compact" id="editor-card" style="display:none;">
      <div class="card-head">
        <h2 id="editor-title">Editing quiz</h2>
        <button class="ghost small" id="editor-close">Close</button>
      </div>
      <div id="editor-body"></div>
    </section>

    <section class="card compact" id="results-card" style="display:none;">
      <div class="card-head">
        <h2 id="results-title">Quiz session results</h2>
        <button class="ghost small" id="results-close">Close</button>
      </div>
      <div id="results-body"></div>
    </section>
  </main>

  <script type="module">
    import { $, api, el, escapeHtml, toast, errorToast } from "/static/common.js";

    let quizzes = [];
    let qsessions = [];
    let editing = null;     // the loaded quiz tree currently in the editor card
    let editingId = null;   // quiz id currently shown in the editor card
    let resultsId = null;   // quiz_run id currently shown in the results card

    // ---------- list loaders ----------

    async function loadQuizzes() {
      quizzes = await api("/api/quizzes");
      const tbody = $("#quiz-rows");
      if (!quizzes.length) {
        tbody.innerHTML = `<tr><td colspan="4" class="muted small">No quizzes yet. Add one using the title field above.</td></tr>`;
        return;
      }
      tbody.innerHTML = "";
      for (const q of quizzes) {
        const isReady = q.status === "ready";
        const tr = el("tr", { class: "rowable" + (editingId === q.id ? " selected" : "") });
        tr.appendChild(el("td", {}, q.title));
        tr.appendChild(el("td", {},
          el("span", { class: "badge " + (isReady ? "badge-ready" : "badge-draft") }, isReady ? "Ready" : "Draft")));
        tr.appendChild(el("td", { class: "num muted" }, String(q.item_count)));
        const actions = el("td", { class: "actions" });
        const toggleBtn = isReady
          ? el("button", { class: "ghost xsmall", onclick: ev => { ev.stopPropagation(); unpublishQuiz(q.id); } }, "Unpublish")
          : el("button", { class: "primary xsmall", onclick: ev => { ev.stopPropagation(); publishQuiz(q.id); } }, "Publish");
        actions.appendChild(toggleBtn);
        actions.appendChild(el("button", { class: "danger ghost xsmall",
          onclick: ev => { ev.stopPropagation(); removeQuiz(q.id); } }, "Delete"));
        tr.appendChild(actions);
        tr.addEventListener("click", () => openQuizDetail(q.id));
        tbody.appendChild(tr);
      }
    }

    async function loadQSessions() {
      qsessions = await api("/api/quiz_runs");
      const tbody = $("#qs-rows");
      if (!qsessions.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="muted small">No quiz runs yet. Open a session as moderator and click <strong>Add to session</strong> to queue one.</td></tr>`;
        return;
      }
      tbody.innerHTML = "";
      for (const r of qsessions) {
        const tr = el("tr", { class: "rowable" + (resultsId === r.id ? " selected" : "") });
        tr.appendChild(el("td", {}, r.quiz_title));
        tr.appendChild(el("td", { class: "muted small" }, "v" + r.version_no));
        tr.appendChild(el("td", {},
          el("span", { class: "muted small" }, r.session_title + " "),
          el("code", { class: "small" }, r.session_code)));
        tr.appendChild(el("td", {}, el("span", { class: "badge badge-" + r.status }, r.status)));
        const progress = r.status === "queued" ? "—"
          : `${Math.min(r.current_item_idx + 1, r.item_count)}/${r.item_count}`;
        tr.appendChild(el("td", { class: "num muted" }, progress));
        tr.appendChild(el("td", { class: "num muted" }, String(r.respondent_count)));
        tr.appendChild(el("td", { class: "muted small" }, new Date(r.created_at).toLocaleString()));
        tr.addEventListener("click", () => openQSDetail(r.id));
        tbody.appendChild(tr);
      }
    }

    // ---------- detail panes (two independent) ----------

    function showEditor(title) {
      $("#editor-title").textContent = title;
      $("#editor-card").style.display = "";
      loadQuizzes();
    }
    function closeEditor() {
      editingId = null;
      editing = null;
      $("#editor-card").style.display = "none";
      loadQuizzes();
    }
    function showResults(title) {
      $("#results-title").textContent = title;
      $("#results-card").style.display = "";
      loadQSessions();
    }
    function closeResults() {
      resultsId = null;
      $("#results-card").style.display = "none";
      loadQSessions();
    }
    $("#editor-close").addEventListener("click", closeEditor);
    $("#results-close").addEventListener("click", closeResults);

    // ---------- quiz CRUD ----------

    async function createQuiz() {
      const titleInp = $("#new-quiz-title");
      const title = titleInp.value.trim();
      if (!title) return;
      try {
        const q = await api("/api/quizzes", { method: "POST", body: { title } });
        titleInp.value = "";
        await loadQuizzes();
        openQuizDetail(q.id);
      } catch (e) { errorToast(e.message); }
    }
    $("#create-quiz").addEventListener("click", createQuiz);
    $("#new-quiz-title").addEventListener("keydown", e => { if (e.key === "Enter") createQuiz(); });

    async function removeQuiz(id) {
      if (!confirm("Delete this quiz template?")) return;
      try {
        await api(`/api/quizzes/${id}`, { method: "DELETE" });
        if (editingId === id) closeEditor();
        loadQuizzes();
        toast("Quiz deleted");
      } catch (e) { errorToast(e.message); }
    }

    async function publishQuiz(id) {
      try {
        await api(`/api/quizzes/${id}/publish`, { method: "POST" });
        loadQuizzes();
        toast("Quiz published");
        if (editingId === id) openQuizDetail(id);
      } catch (e) { errorToast("Can't publish: " + e.message); }
    }

    async function unpublishQuiz(id) {
      try {
        await api(`/api/quizzes/${id}/unpublish`, { method: "POST" });
        loadQuizzes();
        if (editingId === id) openQuizDetail(id);
      } catch (e) { errorToast(e.message); }
    }

    // ---------- quiz editor (inside detail pane) ----------

    async function openQuizDetail(id) {
      try {
        editing = await api(`/api/quizzes/${id}?include_correct=true`);
        editingId = id;
        showEditor(`Editing quiz: ${editing.title}`);
        renderEditor();
      } catch (e) { errorToast(e.message); }
    }

    function renderEditor() {
      const body = $("#editor-body");
      body.innerHTML = "";
      const isReady = editing.status === "ready";
      const headRow = el("div", { class: "row gap" },
        el("span", { class: "badge " + (isReady ? "badge-ready" : "badge-draft") }, isReady ? "Ready" : "Draft"));
      body.appendChild(headRow);

      body.appendChild(el("div", { class: "small muted", style: "margin-bottom: 8px;" },
        "Edits are versioned at next Launch — they don't affect past runs."));

      const titleInp = el("input", { value: editing.title, class: "inline" });
      titleInp.addEventListener("change", async () => {
        const r = await api(`/api/quizzes/${editing.id}`, { method: "PATCH", body: { title: titleInp.value } });
        editing.title = titleInp.value;
        if (r && r.status) editing.status = r.status;
        loadQuizzes();
        renderEditor();
        $("#editor-title").textContent = `Editing quiz: ${editing.title}`;
      });
      body.appendChild(el("div", { class: "row gap field-row" },
        el("label", { class: "small muted" }, "Title"), titleInp));

      for (const it of editing.items) body.appendChild(renderItem(it));

      body.appendChild(el("div", { class: "row gap", style: "margin-top: 10px;" },
        el("button", { class: "primary small", onclick: addItem }, "+ Add item")));
    }

    function renderItem(qq) {
      const wrap = el("div", { class: "editor-q compact" });

      const textInp = el("textarea", { rows: 2 }, qq.text);
      textInp.addEventListener("change", () => patchItem(qq.id, { text: textInp.value }));

      const typeSel = el("select", { class: "inline narrow" });
      for (const t of ["single", "multi"]) {
        const o = el("option", { value: t }, t === "single" ? "Single" : "Multiple");
        if (qq.qtype === t) o.setAttribute("selected", "");
        typeSel.appendChild(o);
      }
      typeSel.addEventListener("change", () => patchItem(qq.id, { qtype: typeSel.value }));

      const head = el("div", { class: "row gap" },
        el("strong", {}, `Q${qq.order_index + 1}`), typeSel, el("div", { class: "spacer" }),
        el("button", { class: "danger ghost xsmall", onclick: async () => {
          if (!confirm("Delete this question?")) return;
          await api(`/api/quiz_items/${qq.id}`, { method: "DELETE" });
          openQuizDetail(editing.id);
        } }, "Delete"));
      wrap.appendChild(head);
      wrap.appendChild(textInp);

      // image control (compact)
      const imgRow = el("div", { class: "row gap small muted", style: "margin-top: 6px;" });
      if (qq.image_url) imgRow.appendChild(el("img", { src: qq.image_url, class: "thumb" }));
      const imgInp = el("input", { type: "file", accept: "image/*", class: "inline" });
      imgInp.addEventListener("change", async () => {
        if (!imgInp.files[0]) return;
        const url = await uploadImage(imgInp.files[0]);
        if (url) { await patchItem(qq.id, { image_url: url }); openQuizDetail(editing.id); }
      });
      imgRow.appendChild(imgInp);
      if (qq.image_url) imgRow.appendChild(el("button", { class: "ghost xsmall", onclick: async () => {
        await patchItem(qq.id, { image_url: null }); openQuizDetail(editing.id);
      } }, "Clear"));
      wrap.appendChild(imgRow);

      // options
      const opts = el("div", { class: "options" });
      for (const op of qq.options) opts.appendChild(renderOption(qq, op));
      wrap.appendChild(opts);
      wrap.appendChild(el("button", { class: "ghost xsmall", style: "margin-top: 4px;",
        onclick: async () => {
          await api(`/api/quiz_items/${qq.id}/options`, { method: "POST", body: { text: "New option" } });
          openQuizDetail(editing.id);
        } }, "+ Option"));
      return wrap;
    }

    function renderOption(qq, op) {
      const row = el("div", { class: "editor-opt" });
      const correctBox = el("input", { type: "checkbox" });
      if (op.is_correct) correctBox.setAttribute("checked", "");
      correctBox.addEventListener("change", () => patchOption(op.id, { is_correct: correctBox.checked }));
      const txt = el("input", { type: "text", value: op.text, class: "inline" });
      txt.addEventListener("change", () => patchOption(op.id, { text: txt.value }));
      row.appendChild(el("label", { class: "small", title: "Correct" }, correctBox));
      row.appendChild(txt);
      if (op.image_url) row.appendChild(el("img", { src: op.image_url, class: "thumb-sm" }));
      row.appendChild(el("button", { class: "danger ghost xsmall", onclick: async () => {
        await api(`/api/quiz_options/${op.id}`, { method: "DELETE" });
        openQuizDetail(editing.id);
      } }, "✕"));
      return row;
    }

    async function patchItem(id, body) {
      try {
        await api(`/api/quiz_items/${id}`, { method: "PATCH", body });
        // Edits no longer change status (versioning happens at Launch).
        loadQuizzes();
      } catch (e) { errorToast(e.message); }
    }
    async function patchOption(id, body) {
      try {
        await api(`/api/quiz_options/${id}`, { method: "PATCH", body });
        loadQuizzes();
      } catch (e) { errorToast(e.message); }
    }
    async function addItem() {
      try {
        await api(`/api/quizzes/${editing.id}/items`, {
          method: "POST", body: { text: "New item", qtype: "single" },
        });
        openQuizDetail(editing.id);
      } catch (e) { errorToast(e.message); }
    }
    async function uploadImage(file) {
      const fd = new FormData(); fd.append("file", file);
      const r = await fetch("/api/uploads", { method: "POST", body: fd, credentials: "same-origin" });
      if (!r.ok) { errorToast("Upload failed"); return null; }
      return (await r.json()).url;
    }

    // ---------- quiz session results (separate pane) ----------

    async function openQSDetail(id) {
      try {
        const r = await api(`/api/quiz_runs/${id}/results`);
        resultsId = id;
        showResults(`Quiz session: ${r.quiz_title} in ${r.session_code}`);
        renderResults(r);
      } catch (e) { errorToast(e.message); }
    }

    function renderResults(r) {
      const body = $("#results-body");
      body.innerHTML = "";
      const head = el("div", { class: "row gap" },
        el("span", { class: "badge badge-" + r.status }, r.status),
        el("span", { class: "muted small" },
          `${r.session_title} · `,
          el("code", { class: "small" }, r.session_code)),
        el("div", { class: "spacer" }),
        el("a", { href: `/m/${r.session_code}`, target: "_blank", class: "small" }, "Open moderator →"));
      body.appendChild(head);

      if (!r.items.length) {
        body.appendChild(el("div", { class: "muted small", style: "margin-top: 12px;" }, "Quiz has no questions."));
        return;
      }
      for (let i = 0; i < r.items.length; i++) {
        const q = r.items[i];
        const max = Math.max(1, q.respondents);
        const card = el("div", { class: "result-q" });
        card.appendChild(el("div", { class: "row gap" },
          el("strong", {}, `Q${i + 1}.`),
          el("span", {}, q.text),
          el("div", { class: "spacer" }),
          el("span", { class: "small muted" }, `${q.respondents} respondent${q.respondents === 1 ? "" : "s"}`)));
        if (q.image_url) card.appendChild(el("img", { src: q.image_url, class: "thumb", style: "margin-top: 6px;" }));
        for (const op of q.options) {
          const pct = Math.round((op.count / max) * 100);
          const cls = "result-opt" + (op.is_correct ? " correct" : "");
          const optRow = el("div", { class: cls });
          const bar = el("div", { class: "result-bar" });
          bar.style.width = pct + "%";
          optRow.appendChild(bar);
          optRow.appendChild(el("span", { class: "result-mark" }, op.is_correct ? "✓" : ""));
          optRow.appendChild(el("span", { class: "result-text" }, op.text));
          optRow.appendChild(el("span", { class: "result-num" }, `${op.count} · ${pct}%`));
          card.appendChild(optRow);
        }
        body.appendChild(card);
      }
    }

    // ---------- init ----------

    loadQuizzes();
    loadQSessions();
  </script>
</body>
</html>
