name: CI & publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref keeps the image cache warm and avoids races.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Frontend deps so the UI test fixture can `npm run build` the Vite app.
      - run: npm ci
      - run: uv sync
      - name: Pre-commit hooks on every file (lint, types, hygiene, secrets, PII)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium
      - name: Pytest (with coverage)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=94

  frontend-lint:
    name: ESLint + Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  compose-smoke:
    name: Docker Compose smoke
    needs: [test, frontend-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: docker/setup-buildx-action@v4
      - run: uv sync
      - name: Build image and smoke compose
        env:
          PRASHNA_COMPOSE_SMOKE: "1"
        run: uv run pytest tests/ops/test_compose_smoke.py -q

  build-and-push:
    name: Build & publish Docker image
    needs: [test, frontend-lint, compose-smoke]
    # Only publish on push to main / tags / manual — not on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  published-image-smoke:
    name: Published image smoke
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync
      - name: Smoke exact published image digest
        env:
          PRASHNA_COMPOSE_SMOKE_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build-and-push.outputs.digest }}
        run: uv run pytest tests/ops/test_compose_smoke.py -q

  github-release:
    name: Publish Compose release bundle
    needs: published-image-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build version-pinned archives
        shell: bash
        run: python3 scripts/build_release_bundle.py "${GITHUB_REF_NAME#v}"
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
