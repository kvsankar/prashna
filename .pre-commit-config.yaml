# Pre-commit hooks. Install once with: uv run pre-commit install
# All hooks use the project's own tools (language: system) so versions match
# what CI and local dev already have — no separate managed envs.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (python lint)
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        require_serial: true

      - id: pyrefly
        name: pyrefly (python typecheck)
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false

      - id: tsc
        name: tsc (typecheck frontend)
        entry: npm run --silent typecheck
        language: system
        files: ^(frontend/|tsconfig\.json|vite\.config\.ts)
        pass_filenames: false

      - id: eslint
        name: eslint (frontend ts)
        entry: npm run --silent lint:js
        language: system
        files: ^frontend/src/.*\.ts$
        pass_filenames: false

      - id: stylelint
        name: stylelint (frontend css)
        entry: npm run --silent lint:css
        language: system
        files: ^frontend/.*\.css$
        pass_filenames: false
