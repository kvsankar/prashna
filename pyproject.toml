[project]
name = "prashna"
version = "0.2.0"
description = "Live Q&A and quizzes for any session with an audience"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["live", "q&a", "quiz", "audience", "training", "classroom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "bcrypt>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "playwright>=1.45",
    "ruff>=0.6",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "pyrefly>=1.3.2",
    "pre-commit-hooks>=6.0.0",
    "detect-secrets>=1.5.0",
]

[project.scripts]
# `prashna` starts the server on localhost and opens the browser (cli.py).
prashna = "prashna.cli:main"

[project.urls]
Homepage = "https://kvsankar.github.io/prashna/"
Source = "https://github.com/kvsankar/prashna"
Documentation = "https://github.com/kvsankar/prashna/tree/main/docs"
Issues = "https://github.com/kvsankar/prashna/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prashna"]
# The Vite build (vite.config.ts outDir) is gitignored; ship it anyway.
artifacts = ["prashna/static/**"]

[tool.hatch.build.targets.sdist]
include = ["prashna", "README.md", "LICENSE", "pyproject.toml"]
artifacts = ["prashna/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Minimal, high-signal set: pyflakes (real bugs), pycodestyle errors/warnings,
# import sorting. E501 (line length) is left off to avoid churning existing
# long lines; turn it on later if desired.
select = ["E", "F", "W", "I"]
# E501 (line length): don't churn existing long lines.
# E701/E702/E731: the codebase deliberately uses compact one-liners
# (colon/semicolon statements, lambda assignments) — keep that style.
ignore = ["E501", "E701", "E702", "E731"]

[tool.coverage.run]
source = ["prashna"]
omit = ["tests/*"]
# The CLI tests run the real `prashna` command in a child process; measure it.
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
show_missing = true
# CI gates the full suite with --cov-fail-under (see .github/workflows).

[tool.pyrefly]
# Python type checking (Meta's Pyrefly, also adopted by Google in 2026).
# `uv run pyrefly check` covers the app, scripts and tests; pre-commit and CI
# run it. Raise the preset to "strict" per module as annotations are added.
project-includes = ["prashna", "scripts", "tests"]
preset = "default"
