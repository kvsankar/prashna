[project]
name = "prashna"
version = "0.1.0"
description = "Live Q&A and quiz tool for training sessions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "bcrypt>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "playwright>=1.45",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
asyncio_mode = "auto"
