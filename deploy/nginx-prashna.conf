# /etc/nginx/sites-available/prashna.sankara.net
# Symlink into sites-enabled/ then `sudo nginx -t && sudo systemctl reload nginx`.
# Run certbot after this is live on port 80 to add TLS:
#   sudo certbot --nginx -d prashna.sankara.net

upstream prashna_upstream {
    server 127.0.0.1:8765;
    keepalive 16;
}

# Map for WebSocket connection upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name prashna.sankara.net;

    # Body size matches the in-app 5 MB upload cap.
    client_max_body_size 6m;

    location / {
        proxy_pass http://prashna_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket upgrade for /ws/...
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Long timeouts so live WebSocket connections aren't reaped.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
