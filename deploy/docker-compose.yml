# Server-side compose file for Prashna.
# Lives at /opt/prashna/docker-compose.yml on the Hetzner box.
# Pull a new image and restart with:  cd /opt/prashna && docker compose pull && docker compose up -d
services:
  prashna:
    image: ghcr.io/kvsankar/prashna:latest
    container_name: prashna
    restart: unless-stopped
    # Bind to localhost only — nginx fronts everything with TLS.
    ports:
      - "127.0.0.1:8765:8000"
    env_file:
      - /opt/prashna/.env
    volumes:
      - /opt/prashna/data:/data
      - /opt/prashna/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/admin/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
