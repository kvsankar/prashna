<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Install</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: #f6f7f9; font-family: Inter, system-ui, sans-serif; }
  .term { position: absolute; left: 160px; top: 120px; width: 1600px; height: 820px; background: #1e2227; border-radius: 12px;
          box-shadow: 0 10px 40px rgba(0,0,0,.18); overflow: hidden; }
  .bar { height: 40px; background: #2b3036; display: flex; align-items: center; padding: 0 16px; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #5c636b; }
  .bar span.t { color: #aab2bb; font-size: 16px; margin-left: 12px; }
  pre { margin: 0; padding: 22px 28px; color: #e6e9ec; font: 24px/34px "DejaVu Sans Mono", "Liberation Mono", monospace; white-space: pre-wrap; height: 736px; overflow: hidden; }
  .cmd { color: #ffffff; font-weight: 600; }
  .muted { color: #9aa3ad; }
  .cursor { display: inline-block; width: 12px; height: 26px; background: #e6e9ec; vertical-align: -4px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  h1 { position: absolute; left: 160px; top: 40px; margin: 0; font-size: 36px; font-weight: 600; color: #1f2328; }
</style>
</head>
<body>
<h1>Install and start</h1>
<div class="term">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="t">Terminal</span></div>
  <pre id="out"></pre>
</div>
<script>
  const out = document.getElementById("out");
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  function keepBottom() {
    // Keep the newest lines visible by dropping lines from the top.
    while (out.scrollHeight > out.clientHeight && out.childNodes.length > 1) out.removeChild(out.firstChild);
  }
  async function typeLine(text, cls, charDelay) {
    const span = document.createElement("span");
    if (cls) span.className = cls;
    out.appendChild(span);
    const cur = document.createElement("span"); cur.className = "cursor"; out.appendChild(cur);
    if (charDelay > 0) {
      for (const ch of text) { span.textContent += ch; keepBottom(); await sleep(charDelay); }
    } else {
      span.textContent = text; keepBottom();
    }
    cur.remove();
    out.appendChild(document.createTextNode("\n"));
    keepBottom();
  }
  // lines: array of strings; a line starting with "$ " is typed as a command.
  window.runScript = async function (lines, opts) {
    const o = Object.assign({ charDelay: 45, lineDelay: 90, beforeOutput: 700, beforeCommand: 1200 }, opts || {});
    await sleep(600);
    for (const line of lines) {
      if (line.startsWith("$ ")) {
        await sleep(o.beforeCommand);
        await typeLine(line, "cmd", o.charDelay);
        await sleep(o.beforeOutput);
      } else {
        await typeLine(line, line.trim() === "…" ? "muted" : "", 0);
        await sleep(o.lineDelay);
      }
    }
    const cur = document.createElement("span"); cur.className = "cursor"; out.appendChild(cur);
    return true;
  };
</script>
</body>
</html>
