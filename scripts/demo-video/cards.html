<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prashna demo cards</title>
<!--
  The designed parts of the demo video. shoot_cards.py and compose.py open
  this page, call window.setup(config) once and then window.renderAt(t) for
  every frame; each element's state is a pure function of t, so the frames
  are deterministic. Nothing animates on its own (no CSS transitions or
  animations). Fonts are local (Inter, DejaVu Sans Mono); the QR code is
  drawn with the generator Prashna vendors (frontend/public/vendor/qrcode.js,
  MIT).

  Scenes (config.scene):
    hook      01 + 02: the problem, in the words of the narration
    why       04: why Prashna, in the words of the narration
    terminal  12: `prashna --tunnel cloudflare` and its real output (config.lines)
    end       15: benefit, price, install lines, the cloudflared note, QR code to the landing page
    plate     a still: the navy background and device frames (config.devices)
              drawn behind (config.layer = "bg") or over (= "fg") the
              recordings that compose.py places in the screens
  Times in config are seconds from the start of the clip; shoot_cards.py
  derives them from the narration's part timings (voice/parts.json).
-->
<style>
  /* Values copied from frontend/src/tokens.css. */
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #5f63f0;
    --accent-2: #818cf8;
    --good: #22c55e;
    --bad: #fa8080;
    --warn: #f59e0b;
    --border: #334155;
    --proj-bg: #000;
    --qr-bg: #fff;
    --accent-bg: rgba(99, 102, 241, 0.16);
    --bezel: #0b1220;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
               color: var(--text); font-family: Inter, system-ui, sans-serif; }
  html.transparent, html.transparent body, html.transparent .stage { background: transparent; }
  .stage { position: absolute; inset: 0; overflow: hidden;
           background: radial-gradient(1300px 820px at 50% 42%, #17223b 0%, var(--bg) 72%); }
  .abs { position: absolute; left: 0; top: 0; }
  .drift { position: absolute; inset: 0; }
  .drift svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .brand { display: flex; align-items: center; gap: 0.2em; font-weight: 700; letter-spacing: -0.03em;
           line-height: 1; white-space: nowrap; color: #fff; }
  .brand svg { height: 0.86em; width: auto; overflow: visible; }

  /* hook */
  .hook-line { width: 1920px; text-align: center; font-size: 104px; font-weight: 700; letter-spacing: -0.03em;
               line-height: 1.1; color: #fff; white-space: nowrap; }
  .hook-line.accent { color: var(--accent-2); }

  /* why */
  .why-row { display: flex; align-items: center; gap: 40px; white-space: nowrap; }
  .why-row .ic { width: 104px; height: 104px; border-radius: 26px; background: var(--accent-bg);
                 border: 2px solid rgba(129, 140, 248, 0.35); display: flex; align-items: center; justify-content: center; }
  .why-row .ic svg { width: 60px; height: 60px; fill: none; stroke: var(--accent-2); stroke-width: 2.6;
                     stroke-linecap: round; stroke-linejoin: round; }
  .why-row .tx { font-size: 62px; font-weight: 700; letter-spacing: -0.02em; color: #fff; }
  .why-row .tx .dot { color: var(--accent-2); padding: 0 0.25em; }

  /* terminal and end card boxes */
  .term { border-radius: 16px; overflow: hidden; border: 2px solid var(--border); background: var(--proj-bg);
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(95, 99, 240, 0.15); box-sizing: border-box; }
  .term .tbar { height: 48px; background: var(--panel); display: flex; align-items: center; gap: 12px; padding: 0 20px; }
  .term .tbar i { width: 16px; height: 16px; border-radius: 50%; display: block; }
  .term .tbar span { margin-left: 14px; color: var(--muted); font-size: 22px; font-weight: 500; }
  .term pre { margin: 0; font-family: "DejaVu Sans Mono", "Liberation Mono", monospace; color: var(--text); white-space: pre; }
  .term .ps { color: var(--accent-2); }
  .term .cm { color: var(--muted); }
  .term .hl { border-radius: 8px; padding: 2px 6px; margin: -2px -6px; }
  .caret { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: -0.2em; background: var(--accent-2); }

  /* end */
  #e-head div { font-size: 88px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.14; color: #fff; white-space: nowrap; }
  #e-sub { font-size: 40px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  #e-sub .dot, #e-foot .dot { color: var(--accent-2); padding: 0 0.3em; }
  #e-qr { width: 360px; height: 360px; border-radius: 22px; background: var(--qr-bg); display: flex;
          align-items: center; justify-content: center; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); }
  #e-qr svg { display: block; shape-rendering: crispEdges; }
  #e-url { width: 460px; text-align: center; font-size: 32px; font-weight: 600; color: var(--text); }
  #e-foot { font-size: 32px; font-weight: 600; color: var(--text); white-space: nowrap; }
  #e-note { font-size: 24px; color: var(--muted); white-space: nowrap; }
  #e-tunnel { font-size: 26px; color: var(--muted); white-space: nowrap; }

  /* plates */
  .shadow { position: absolute; background: var(--bezel); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(129, 140, 248, 0.12); }
  .hole { position: absolute; background: #000; }
  .ring { position: absolute; box-sizing: border-box; border-style: solid; border-color: var(--bezel); }
  .label { position: absolute; font-size: 32px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .label .sub { color: var(--muted); font-weight: 500; }
  .addr { position: absolute; display: flex; align-items: center; gap: 8px; box-sizing: border-box; padding: 0 14px;
          background: var(--panel); border-radius: 12px; color: var(--text); font-size: 15px; font-weight: 500;
          white-space: nowrap; overflow: hidden; }
  .addr span { overflow: hidden; text-overflow: ellipsis; }
  .addr svg { flex: none; width: 14px; height: 16px; fill: none; stroke: var(--good); stroke-width: 2.2; }
  .notch { position: absolute; height: 10px; border-radius: 5px; background: var(--panel-2); }
  .titlebar { position: absolute; display: flex; align-items: center; gap: 12px; box-sizing: border-box; padding: 0 20px;
              background: var(--panel); border-radius: 14px 14px 0 0; }
  .titlebar i { width: 15px; height: 15px; border-radius: 50%; display: block; }
  .titlebar span { margin-left: 12px; font-size: 22px; font-weight: 600; color: var(--muted); }
  .stand { position: absolute; background: var(--bezel); }
</style>
<script src="../../frontend/public/vendor/qrcode.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <path id="bubble" d="M20 2 H80 A18 18 0 0 1 98 20 V48 A18 18 0 0 1 80 66 H46 L24 83 L29 66 H20 A18 18 0 0 1 2 48 V20 A18 18 0 0 1 20 2 Z"/>
    </defs>
  </svg>
  <section class="stage" id="stage"><div class="drift" id="drift"></div></section>

<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eBack = (x) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const stage = document.getElementById("stage");
const el = (tag, cls, parent, style, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (style) Object.assign(e.style, style);
  if (text !== undefined) e.textContent = text;
  (parent || stage).appendChild(e);
  return e;
};
const svgEl = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const px = (v) => v + "px";
const place = (node, x, y, o = 1, s = 1) => {
  node.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${s.toFixed(4)})`;
  node.style.opacity = o.toFixed(3);
};
// Fade and rise in from `at` over `dur` seconds.
const rise = (node, t, at, dy = 28, dur = 0.45) => { const p = eOut(prog(t, at, at + dur)); place(node, 0, dy * (1 - p), p); };
function brand(parent, x, y, size) {
  const b = el("div", "abs brand", parent, { left: px(x), top: px(y), fontSize: px(size) });
  b.innerHTML = `<svg viewBox="0 0 100 84"><use href="#bubble" fill="var(--accent)"/>` +
    `<text x="50" y="52" text-anchor="middle" font-family="Inter" font-weight="700" ` +
    `font-size="50" fill="#fff">?</text></svg><span>prashna</span>`;
  return b;
}
// Faint question bubbles drifting up behind everything (seeded, so repeatable).
function makeDrift(seed) {
  const container = document.getElementById("drift");
  let s = seed;
  const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
  const items = [];
  for (let i = 0; i < 18; i++) {
    const size = 26 + rnd() * 46;
    const svg = svgEl("svg", { viewBox: "0 0 100 84", width: size, height: size * 0.84 }, container);
    svgEl("use", { href: "#bubble", fill: "none", stroke: "#818cf8", "stroke-width": 4 }, svg);
    items.push({ svg, x: rnd() * 1920, y: rnd() * 1200, v: 16 + rnd() * 26, a: 0.35 + rnd() * 0.65, ph: rnd() * 6.28 });
  }
  return (t, level) => {
    for (const it of items) {
      const y = ((it.y - it.v * t) % 1200 + 1200) % 1200 - 80;
      const x = it.x + 14 * Math.sin(it.ph + t * 0.6);
      it.svg.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
      it.svg.style.opacity = (level * it.a).toFixed(3);
    }
  };
}

let C = null;      // config
let R = null;      // per-scene render function

/* ---------------------------------------------------------------- hook */
function buildHook() {
  const drift = makeDrift(7);
  const l1 = el("div", "abs hook-line", null, { top: "300px" }, "Half the room has a question.");
  const l2 = el("div", "abs hook-line accent", null, { top: "430px" }, "Nobody asks.");
  const l3 = el("div", "abs hook-line", null, { top: "640px" }, "And you can't tell who's keeping up.");
  return (t) => {
    drift(t, 0.12);
    const dim = 1 - 0.5 * eOut(prog(t, C.at[2] - 0.1, C.at[2] + 0.4));
    rise(l1, t, C.at[0]);
    rise(l2, t, C.at[1]);
    rise(l3, t, C.at[2]);
    l1.style.opacity = (parseFloat(l1.style.opacity) * dim).toFixed(3);
    l2.style.opacity = (parseFloat(l2.style.opacity) * dim).toFixed(3);
  };
}

/* ----------------------------------------------------------------- why */
const ICONS = {
  laptop: '<rect x="12" y="12" width="40" height="28" rx="3"/><path d="M6 50h52l-4-8H10z"/>',
  command: '<rect x="6" y="10" width="52" height="44" rx="5"/><path d="M16 26l8 6-8 6M30 40h14"/>',
  globe: '<circle cx="32" cy="32" r="24"/><path d="M8 32h48M32 8c8 8 8 40 0 48M32 8c-8 8-8 40 0 48"/>',
  shield: '<path d="M32 6l22 8v16c0 14-9 23-22 28C19 53 10 44 10 30V14z"/><path d="M22 32l7 7 13-14"/>',
};
function buildWhy() {
  const drift = makeDrift(11);
  brand(null, 120, 92, 64);
  const rows = C.rows.map(([icon, html], k) => {
    const r = el("div", "abs why-row", null, { left: "200px", top: px(244 + k * 172) });
    r.innerHTML = `<div class="ic"><svg viewBox="0 0 64 64">${ICONS[icon]}</svg></div><div class="tx">${html}</div>`;
    return r;
  });
  return (t) => {
    drift(t, 0.07);
    rows.forEach((r, k) => rise(r, t, C.at[k], 30));
  };
}

/* ------------------------------------------------------------ terminal */
function buildTerminal() {
  const drift = makeDrift(5);
  const box = el("div", "abs term", null, { left: "160px", top: "230px", width: "1600px", height: "580px" });
  box.innerHTML = '<div class="tbar"><i style="background:var(--bad)"></i><i style="background:var(--warn)"></i>' +
    '<i style="background:var(--good)"></i><span>Terminal</span></div>';
  // The tunnel's address is new on every run, so the type shrinks to fit the longest line.
  const longest = Math.max(...C.lines.map((l) => l.length));
  const size = Math.min(34, Math.floor(1490 / (longest * 0.602)));
  const pre = el("pre", "", box, { padding: "36px 44px", fontSize: px(size), lineHeight: "54px" });
  const lines = C.lines.map(() => el("div", "", pre, { minHeight: "54px" }));
  const caret = el("span", "caret");
  return (t) => {
    drift(t, 0.06);
    let last = null;
    C.lines.forEach((text, k) => {
      const node = lines[k];
      const at = C.at[k];
      node.innerHTML = "";
      if (t < at) return;
      if (k === 0) {
        // The command, typed; the flag is lit while the narration names it.
        const body = text.slice(2);
        const shown = body.slice(0, Math.round(body.length * prog(t, at, at + C.typeFor)));
        const flagAt = body.indexOf("--tunnel");
        const lit = eOut(prog(t, C.flagAt, C.flagAt + 0.3));
        el("span", "ps", node, null, "$ ");
        el("span", "", node, { color: "#fff", fontWeight: "700" }, shown.slice(0, flagAt));
        if (shown.length > flagAt) {
          el("span", "hl", node, { color: "#fff", fontWeight: "700",
            background: `rgba(95,99,240,${(0.45 * lit).toFixed(3)})` }, shown.slice(flagAt));
        }
      } else if (text.startsWith("Participants join at: ")) {
        const lit = eOut(prog(t, C.urlAt, C.urlAt + 0.3));
        el("span", "", node, null, "Participants join at: ");
        el("span", "hl", node, { color: lit > 0 ? "#fff" : "var(--text)", fontWeight: lit > 0 ? "700" : "400",
          background: `rgba(95,99,240,${(0.45 * lit).toFixed(3)})` }, text.slice(22));
      } else {
        node.textContent = text;
      }
      last = node;
    });
    if (last) last.appendChild(caret);
    caret.style.opacity = Math.floor(t / 0.55) % 2 === 0 ? "1" : "0";
  };
}

/* ----------------------------------------------------------------- end */
function buildEnd() {
  const drift = makeDrift(11);
  const b = brand(null, 120, 92, 64);
  const head = el("div", "abs", null, { left: "116px", top: "196px" });
  head.id = "e-head";
  const heads = C.head.map((s) => el("div", "", head, null, s));
  const sub = el("div", "abs", null, { left: "120px", top: "566px" });
  sub.id = "e-sub";
  sub.innerHTML = 'Install with one line<span class="dot">&middot;</span>macOS<span class="dot">&middot;</span>Linux<span class="dot">&middot;</span>Windows';
  const term = el("div", "abs term", null, { left: "120px", top: "636px", width: "1680px" });
  term.innerHTML = '<div class="tbar"><i style="background:var(--bad)"></i><i style="background:var(--warn)"></i><i style="background:var(--good)"></i></div>';
  const pre = el("pre", "", term, { padding: "26px 38px 30px", fontSize: "27px", lineHeight: "46px" });
  pre.innerHTML = C.install.map(([kind, text]) => kind === "#"
    ? `<span class="cm"># ${text}</span>` : `<span class="ps">${kind} </span>${text.replace(/&/g, "&amp;").replace(/</g, "&lt;")}`).join("\n");
  const qr = el("div", "abs", null, { left: "1440px", top: "150px" });
  qr.id = "e-qr";
  const code = qrcode(0, "M");
  code.addData(C.qr);
  code.make();
  const n = code.getModuleCount(), cell = Math.floor(320 / (n + 4)), size = cell * (n + 4);
  const svg = svgEl("svg", { width: size, height: size, viewBox: `0 0 ${n + 4} ${n + 4}` }, qr);
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (code.isDark(r, c)) d += `M${c + 2} ${r + 2}h1v1h-1z`;
  svgEl("path", { d, fill: "#000" }, svg);
  const url = el("div", "abs", null, { left: "1390px", top: "530px" }, C.qrLabel);
  url.id = "e-url";
  const tunnel = el("div", "abs", null, { left: "120px", top: "946px" }, C.tunnelNote);
  tunnel.id = "e-tunnel";
  const foot = el("div", "abs", null, { left: "120px", top: "1000px" });
  foot.id = "e-foot";
  foot.innerHTML = 'Open source<span class="dot">&middot;</span>MIT';
  const note = el("div", "abs", null, { left: "1300px", top: "1006px", width: "500px", textAlign: "right" }, "The narration is a synthetic voice.");
  note.id = "e-note";
  return (t) => {
    drift(t, 0.06);
    rise(b, t, 0.0, 16);
    heads.forEach((h, k) => rise(h, t, C.at[k], 30));
    rise(sub, t, C.at[3], 20);
    rise(term, t, C.at[3] + 0.15, 30);
    const q = eBack(prog(t, C.at[3] + 0.3, C.at[3] + 0.9));
    qr.style.transform = `scale(${(0.9 + 0.1 * q).toFixed(4)})`;
    qr.style.opacity = prog(t, C.at[3] + 0.3, C.at[3] + 0.65).toFixed(3);
    rise(url, t, C.at[3] + 0.5, 12);
    rise(tunnel, t, C.at[3] + 0.4, 12);
    rise(foot, t, C.at[3] + 0.7, 12);
    note.style.opacity = prog(t, C.at[3] + 0.8, C.at[3] + 1.2).toFixed(3);
  };
}

/* --------------------------------------------------------------- plate */
// Each device: {kind: "screen" | "phone" | "window", x, y, w, h} is the
// screen rectangle that compose.py fills with a recording.
const BEZEL = { screen: 14, phone: 12, window: 2 };
const TOP = { screen: 14, phone: 50, window: 46 };
const BOTTOM = { screen: 14, phone: 18, window: 2 };
const OUTER_R = { screen: 18, phone: 44, window: 16 };
function buildPlate() {
  const fg = C.layer === "fg";
  if (fg) document.documentElement.classList.add("transparent");
  else makeDrift(3)(0, 0.05);
  for (const d of C.devices) {
    const b = BEZEL[d.kind], top = TOP[d.kind], bottom = BOTTOM[d.kind];
    const ox = d.x - b, oy = d.y - top, ow = d.w + 2 * b, oh = d.h + top + bottom;
    if (!fg) {
      if (d.kind === "screen") {
        el("div", "stand", null, { left: px(d.x + d.w / 2 - 70), top: px(oy + oh), width: "140px", height: "34px" });
        el("div", "stand", null, { left: px(d.x + d.w / 2 - 170), top: px(oy + oh + 30), width: "340px", height: "12px", borderRadius: "6px" });
      }
      el("div", "shadow", null, { left: px(ox), top: px(oy), width: px(ow), height: px(oh), borderRadius: px(OUTER_R[d.kind]) });
      el("div", "hole", null, { left: px(d.x), top: px(d.y), width: px(d.w), height: px(d.h) });
      continue;
    }
    // Foreground: the bezel as a ring whose rounded inner corners mask the recording's corners.
    const ring = el("div", "ring", null, { left: px(ox), top: px(oy), width: px(ow), height: px(oh),
      borderWidth: `${top}px ${b}px ${bottom}px ${b}px`, borderRadius: px(OUTER_R[d.kind]) });
    if (d.kind === "phone") {
      if (d.url) {
        const a = el("div", "addr", null, { left: px(d.x + 6), top: px(oy + 10), width: px(d.w - 12), height: "32px" });
        a.innerHTML = '<svg viewBox="0 0 14 16"><rect x="1.5" y="7" width="11" height="8" rx="1.5"/><path d="M4 7V5a3 3 0 0 1 6 0v2"/></svg>';
        el("span", "", a, null, d.url);
      } else {
        el("div", "notch", null, { left: px(d.x + d.w / 2 - 30), top: px(oy + 20), width: "60px" });
      }
    }
    if (d.kind === "window") {
      ring.style.borderColor = "var(--border)";
      const tb = el("div", "titlebar", null, { left: px(ox), top: px(oy), width: px(ow), height: px(top) });
      tb.innerHTML = '<i style="background:var(--bad)"></i><i style="background:var(--warn)"></i><i style="background:var(--good)"></i>';
      if (d.title) el("span", "", tb, null, d.title);
    }
  }
  for (const l of C.labels || []) {
    const n = el("div", "label", null, { left: px(l.x), top: px(l.y), fontSize: px(l.size || 32) });
    n.innerHTML = l.html;
    if (l.center) n.style.transform = "translateX(-50%)";
  }
  if (C.brand) brand(null, C.brand.x, C.brand.y, C.brand.size);
  return () => {};
}

window.setup = async (config) => {
  C = config;
  await document.fonts.ready;
  R = { hook: buildHook, why: buildWhy, terminal: buildTerminal, end: buildEnd, plate: buildPlate }[C.scene]();
  R(0);
  return true;
};
window.renderAt = (t) => R(t);
</script>
</body>
</html>
